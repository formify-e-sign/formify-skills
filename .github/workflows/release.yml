name: release

# Tag-driven, so an ordinary push to main can never publish a version.
# Cut a release with (scripts/ is dev tooling, kept in formify-skills-internal):
#   npm run release <version> && npm run check
#   git commit -am "release <version>" && git tag v<version>
#   git push && git push origin v<version>
#
# Push the tag by name. `git push --follow-tags` looks right and silently does
# nothing here: it carries annotated tags only, and `git tag <name>` makes a
# lightweight one. v1.5.0 was cut, pushed that way, and never left the machine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The public tree carries no scripts/, so the version check is inline: the
      # tag must equal the core version in every core manifest. Sector plugins
      # (formify-es-real-estate) version independently and are not checked here.
      - name: The tag matches the core version in every manifest
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tagged = process.argv[1];
            const places = [
              ["plugin.json", "version"],
              [".claude-plugin/plugin.json", "version"],
              [".codex-plugin/plugin.json", "version"],
              ["package.json", "version"],
              ["plugins/formify/.claude-plugin/plugin.json", "version"],
              ["plugins/formify/.codex-plugin/plugin.json", "version"],
            ];
            const mp = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const core = mp.plugins.find((p) => p.name === "formify");
            const found = places.map(([f, k]) => [f, JSON.parse(fs.readFileSync(f, "utf8"))[k]]);
            found.push([".claude-plugin/marketplace.json#formify", core && core.version]);
            const bad = found.filter(([, v]) => v !== tagged);
            for (const [f, v] of bad) console.error(`${f}: ${v} != tag ${tagged}`);
            if (bad.length) { console.error("run: npm run release " + tagged); process.exit(1); }
            console.log(`version ${tagged} agrees across ${found.length} places`);
          ' "$tagged"

      # One ZIP per skill, attached to the release. This is the only install path
      # for a Claude Desktop or claude.ai user who has no GitHub account: the
      # marketplace dialog there is a picker over their own repositories, not a
      # free-text field, so they cannot reach a public repo that way. They download
      # a ZIP from the release page and upload it. claude.ai requires the skill
      # folder itself to be the top of the archive, which is what `cd skills` gives.
      - name: One uploadable ZIP per skill
        run: |
          mkdir -p dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -qr "../dist/$name.zip" "$name" \
              -x "$name/tests/*" "$name/**/__pycache__/*")
          done
          ls -l dist

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
