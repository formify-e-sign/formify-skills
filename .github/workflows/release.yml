name: release

# Tag-driven, so an ordinary push to main can never publish a version.
# Cut a release with:
#   npm run release <version> && npm run check
#   git commit -am "release <version>" && git tag v<version> && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: The tag matches the version in every manifest and skill
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./plugin.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match declared version $declared" >&2
            echo "run: npm run release $tagged" >&2
            exit 1
          fi
          node scripts/release.mjs --check

      - name: Same checks as every push
        run: npm run check

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
